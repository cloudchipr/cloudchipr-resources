{{- include "..netmon.validate" . }}
{{ $createSecret := (include "..createSecret" .) }}
{{- $netmon := .Values.netmon }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "..fullname" . }}
  namespace: {{ include "..namespace" . }}
  labels:
    {{- include "..labels" . | nindent 4 }}
    {{- with .Values.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if or (eq $createSecret "true") .Values.annotations }}
  annotations:
  {{- if eq $createSecret "true" }}
    checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
  {{- end }}
  {{- with .Values.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "..selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "..selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (eq $createSecret "true") .Values.podAnnotations }}
      annotations:
      {{- if eq $createSecret "true" }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "..serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: c8r-agent
        image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.repository ( default .Chart.AppVersion .Values.image.tag) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: C8R_CHART_VERSION
            value: {{ .Chart.Version | quote }}
          - name: C8R_HELM_RELEASE_NAME
            value: {{ .Release.Name }}
          {{- range $k, $v := .Values.gpuCollection }}
          - name: {{ printf "C8R_GPU_EXPORTER_%s" (upper $k )}}
            value: {{ $v | quote }}
          {{- end }}
          {{- if $netmon.enabled }}
          # netmon server: metadata/enrollment API on every replica, puller on the leader.
          - name: C8R_NETMON_ENABLED
            value: "true"
          # IP SAN of the agent certificate.
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: C8R_NETMON_COLLECTOR_SELECTOR
            value: {{ include "..netmon.collectorSelector" . | quote }}
          - name: C8R_NETMON_COLLECTOR_PORT
            value: {{ $netmon.collector.port | quote }}
          - name: C8R_NETMON_WINDOW_SECONDS
            value: {{ $netmon.windowSeconds | quote }}
          - name: C8R_NETMON_RETENTION_SECONDS
            value: {{ $netmon.retentionSeconds | quote }}
          - name: C8R_NETMON_RESOLVE_MODE
            value: {{ $netmon.resolveMode | default "snapshot" | quote }}
          {{- if eq ($netmon.resolveMode | default "snapshot") "auto" }}
          - name: C8R_NETMON_RESOLVE_AUTO_PODS
            value: {{ $netmon.resolveAutoPods | default 20000 | quote }}
          {{- end }}
          - name: C8R_NETMON_SERVER_PORT
            value: {{ $netmon.agent.serverPort | quote }}
          - name: C8R_NETMON_PLAIN_PORT
            value: {{ $netmon.agent.plainPort | quote }}
          - name: C8R_NETMON_SERVICE_NAME
            value: {{ $netmon.service.name | quote }}
          {{- include "..netmon.tlsEnv" (dict "root" . "side" "agent") | nindent 10 }}
          - name: C8R_NETMON_CLOUD_RANGES_ENABLED
            value: {{ $netmon.cloudRanges.enabled | quote }}
          - name: C8R_NETMON_CLOUD_RANGES_TIMEOUT
            value: {{ $netmon.cloudRanges.timeout | quote }}
          {{- with $netmon.cloudRanges.urls }}
          {{- $pairs := list }}
          {{- range $provider := keys . | sortAlpha }}
          {{- $pairs = append $pairs (printf "%s=%s" $provider (index $netmon.cloudRanges.urls $provider)) }}
          {{- end }}
          # provider=url pairs, sorted by provider for a stable rendering.
          - name: C8R_NETMON_CLOUD_RANGES_URLS
            value: {{ join "," $pairs | quote }}
          {{- end }}
          {{- with $netmon.tls.extraSANs }}
          - name: C8R_NETMON_TLS_EXTRA_SANS
            value: {{ join "," . | quote }}
          {{- end }}
          {{- if $netmon.ui.enabled }}
          - name: C8R_NETMON_UI
            value: "true"
          - name: C8R_NETMON_UI_PORT
            value: {{ $netmon.ui.port | quote }}
          - name: C8R_NETMON_UI_WINDOWS
            value: {{ $netmon.ui.windows | quote }}
          {{- with $netmon.ui.allowedSubjects }}
          - name: C8R_NETMON_UI_ALLOWED_SUBJECTS
            value: {{ join "," . | quote }}
          {{- end }}
          {{- if $netmon.ui.insecure }}
          - name: C8R_NETMON_UI_INSECURE
            value: "true"
          {{- end }}
          {{- end }}
          {{- with $netmon.agent.addEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- end }}
        {{- with .Values.addEnv }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .Values.config.existingSecret (eq $createSecret "true") .Values.addEnvFrom }}
        envFrom:
          {{- if .Values.config.existingSecret }}
          - secretRef:
              name: {{ .Values.config.existingSecret }}
          {{- end }}
          {{- if eq $createSecret "true" }}
          - secretRef:
              name: {{ include "..fullname" . }}
          {{- end }}
          {{- with .Values.addEnvFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
        {{- if $netmon.enabled }}
        ports:
          - name: netmon
            containerPort: {{ $netmon.agent.serverPort }}
            protocol: TCP
          - name: netmon-plain
            containerPort: {{ $netmon.agent.plainPort }}
            protocol: TCP
          {{- if $netmon.ui.enabled }}
          - name: netmon-ui
            containerPort: {{ $netmon.ui.port }}
            protocol: TCP
          {{- end }}
        # Plain port: /healthz is 503 until the netmon TLS material is
        # loaded, so the netmon Service only routes collectors to replicas
        # that can serve them. /livez is 200 while the process serves.
        readinessProbe:
          httpGet:
            path: /healthz
            port: netmon-plain
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /livez
            port: netmon-plain
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        {{- if eq $netmon.tls.mode "files" }}
        volumeMounts:
          - name: netmon-tls
            mountPath: {{ $netmon.tls.files.mountPath }}
            readOnly: true
        {{- end }}
        {{- end }}
      {{- if .Values.networkCollection.enabled }}
      - name: c8r-network-agent
        image: {{ printf "%s/%s:%s" .Values.image.registry .Values.image.repository ( default .Chart.AppVersion .Values.image.tag) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
          - c8r-networkagent-server
        ports:
          - containerPort: 8873
            protocol: TCP
            name: metrics
          - containerPort: 8874
            protocol: TCP
            name: grpc
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.networkCollection.server.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /live
            port: metrics
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        {{- with .Values.addEnv }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.networkCollection.server.addEnv }}
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .Values.config.existingSecret (eq $createSecret "true") .Values.addEnvFrom .Values.networkCollection.server.addEnvFrom }}
        envFrom:
          {{- if .Values.config.existingSecret }}
          - secretRef:
              name: {{ .Values.config.existingSecret }}
          {{- end }}
          {{- if eq $createSecret "true" }}
          - secretRef:
              name: {{ include "..fullname" . }}
          {{- end }}
          {{- with .Values.addEnvFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.networkCollection.server.addEnvFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- if and $netmon.enabled (eq $netmon.tls.mode "files") }}
      volumes:
        - name: netmon-tls
          secret:
            secretName: {{ $netmon.tls.files.agent.secretName }}
      {{- end }}
